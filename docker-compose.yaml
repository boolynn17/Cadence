services:
  postgres:
    image: postgres:16
    container_name: cadence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cadence-db-data:/var/lib/postgresql/data

volumes:
  cadence-db-data: